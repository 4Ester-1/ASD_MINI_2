# fly.toml app configuration file generated for asd-mini-2 on 2026-11-24T10:15:13Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'asd-mini-2'
primary_region = 'arn'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
