# Konfiguracja Fly.io dla ASD1-M2-14 (app = "asd-mini-2").
# Wdrożenie:  fly deploy   (z katalogu zawierającego ten plik + Dockerfile).

app = "asd-mini-2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
